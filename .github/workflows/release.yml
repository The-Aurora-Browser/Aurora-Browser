name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1.2)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LADYBIRD_REPO: "https://github.com/LadybirdBrowser/ladybird.git"
  LADYBIRD_BRANCH: "master"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-.*)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v*.*(*) pattern"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Release: $TAG (v$VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          FILE_VER="$(cat VERSION | tr -d ' \n\r')"
          TAG_VER="${{ steps.parse.outputs.version }}"
          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error::VERSION file ($FILE_VER) != tag ($TAG_VER)"
            exit 1
          fi
          echo "Version sync OK: $FILE_VER"

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /tmp/extracted
          sudo apt-get update
          sudo apt-get install -y pigz
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build \
            git pkg-config autoconf autoconf-archive automake nasm \
            qt6-base-dev qt6-tools-dev-tools qt6-wayland \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev \
            zip unzip tar curl ccache python3 \
            rpm dpkg-dev file

      - name: Configure Qt6 CMake path
        run: |
          # Detect Qt6 installation and set CMAKE_PREFIX_PATH for vcpkg
          if pkg-config --exists Qt6Core; then
            QT6_LIBDIR=$(pkg-config --variable=libdir Qt6Core)
            QT6_CMAKE_PATH=$(dirname "$QT6_LIBDIR")/cmake/Qt6
            if [ -d "$QT6_CMAKE_PATH" ]; then
              echo "CMAKE_PREFIX_PATH=$QT6_CMAKE_PATH" >> $GITHUB_ENV
              echo "✓ Qt6 CMake path configured: $QT6_CMAKE_PATH"
            else
              echo "⚠ Qt6 CMake path not found, vcpkg will attempt to build from source"
            fi
          else
            echo "⚠ Qt6Core not found via pkg-config"
          fi

      - name: Install Rust
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          rustup default stable
          rustup update

      - name: Clone Ladybird
        run: |
          git clone --depth 1 --branch ${{ env.LADYBIRD_BRANCH }} \
            ${{ env.LADYBIRD_REPO }} build/ladybird

      - name: Apply Aurora branding
        run: VERSION=${{ needs.check-version.outputs.version }} bash ./engine/brand.sh build/ladybird

      - name: Build Ladybird (Release)
        working-directory: build/ladybird
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          BUILD_PRESET=Release ./Meta/ladybird.py build
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}

      - name: Package Aurora Browser
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/package.sh build/ladybird \
            build/aurora-browser-${VERSION}-linux $VERSION

      - name: Create tarball
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          cd build
          tar -czf aurora-browser-${VERSION}-linux-x86_64.tar.gz \
            aurora-browser-${VERSION}-linux/

      - name: Build .deb package
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/build-deb.sh build/ladybird build $VERSION || true

      - name: Build .rpm package
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/build-rpm.sh build/ladybird build $VERSION || true

      - name: Build AppImage
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/build-appimage.sh build/ladybird build $VERSION || true

      - name: Generate checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          cd build
          echo "Generating checksums for v${VERSION}..."
          > checksums-SHA256-${VERSION}.txt
          for f in \
            aurora-browser-${VERSION}-linux-x86_64.tar.gz \
            aurora-browser_${VERSION}_amd64.deb \
            aurora-browser-${VERSION}-1.x86_64.rpm \
            Aurora-Browser-${VERSION}-x86_64.AppImage; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> checksums-SHA256-${VERSION}.txt
              echo "  checksummed: $f"
            else
              echo "  SKIP (not built): $f"
            fi
          done
          echo "--- Checksums ---"
          cat checksums-SHA256-${VERSION}.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            build/aurora-browser-*-linux-x86_64.tar.gz
            build/aurora-browser_*_amd64.deb
            build/aurora-browser-*-1.x86_64.rpm
            build/Aurora-Browser-*-x86_64.AppImage
            build/checksums-SHA256-*.txt
          if-no-files-found: warn

  build-macos:
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf autoconf-archive automake ccache cmake \
            libtool nasm ninja pkg-config
          brew install llvm || true

      - name: Clone Ladybird
        run: |
          git clone --depth 1 --branch ${{ env.LADYBIRD_BRANCH }} \
            ${{ env.LADYBIRD_REPO }} build/ladybird

      - name: Apply Aurora branding
        run: VERSION=${{ needs.check-version.outputs.version }} bash ./engine/brand.sh build/ladybird

      - name: Build Ladybird (Release)
        working-directory: build/ladybird
        run: |
          set -euo pipefail
          # Use Homebrew LLVM if available (Apple Clang may lack C++23 support)
          LLVM_PREFIX="$(brew --prefix llvm 2>/dev/null || true)"
          if [ -d "$LLVM_PREFIX" ]; then
            export CC="$LLVM_PREFIX/bin/clang"
            export CXX="$LLVM_PREFIX/bin/clang++"
            echo "Using LLVM from: $LLVM_PREFIX"
            "$CC" --version
          else
            echo "Using system compiler: $(which clang)"
            clang --version
          fi
          BUILD_PRESET=Release ./Meta/ladybird.py build

      - name: Verify build output
        run: |
          set -euo pipefail
          echo "=== Build output ==="
          find build/ladybird -name "*.app" -type d 2>/dev/null || true
          find build/ladybird -name "ladybird" -type f 2>/dev/null | head -5 || true
          find build/ladybird/Build -maxdepth 3 -type f 2>/dev/null | head -20 || true

      - name: Package Aurora Browser
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/package.sh build/ladybird \
            build/aurora-browser-${VERSION}-macos $VERSION
          echo "=== Package output ==="
          find build/aurora-browser-${VERSION}-macos -maxdepth 3 -type f 2>/dev/null | head -20
          ls -la "build/aurora-browser-${VERSION}-macos/Aurora Browser.app/Contents/" 2>/dev/null || true

      - name: Code sign (ad-hoc)
        run: |
          APP=$(find build -name "Aurora Browser.app" -type d | head -n1)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP" 2>/dev/null || true
            echo "Ad-hoc signed: $APP"
          else
            echo "::warning::No .app bundle found for code signing"
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          APP=$(find build -name "Aurora Browser.app" -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::Aurora Browser.app not found in build/"
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          hdiutil create -volname "Aurora Browser" \
            -srcfolder "$APP" -ov -format UDZO \
            "build/Aurora-Browser-${VERSION}-macOS.dmg"
          echo "DMG created: build/Aurora-Browser-${VERSION}-macOS.dmg"
          ls -lh "build/Aurora-Browser-${VERSION}-macOS.dmg"

      - name: Generate checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          cd build
          DMG=$(ls Aurora-Browser-*-macOS.dmg 2>/dev/null | head -n1)
          if [ -n "$DMG" ]; then
            sha256sum "$DMG" > checksums-SHA256-macos-${VERSION}.txt
            echo "Checksums:"
            cat checksums-SHA256-macos-${VERSION}.txt
          else
            echo "::error::No DMG found to checksum"
            echo "Build directory contents:"
            find . -maxdepth 2 -type f -name "*.dmg" -o -name "*.app" 2>/dev/null || true
            exit 1
          fi

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            build/Aurora-Browser-*-macOS.dmg
            build/checksums-SHA256-macos-*.txt
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Windows package
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          WIN_DIR="build/aurora-browser-${VERSION}-windows"
          mkdir -p "$WIN_DIR"

          # Copy icon
          cp assets/icons/aurora.png "$WIN_DIR/aurora.png" 2>/dev/null || true

          # Write .bat launcher (no leading spaces)
          printf '@echo off\r\nset DIR=%%~dp0\r\nif exist "%%DIR%%ladybird.exe" (\r\n    start "" "%%DIR%%ladybird.exe" %%*\r\n) else if exist "%%DIR%%ladybird" (\r\n    echo Run inside WSL2: ./ladybird\r\n    pause\r\n) else (\r\n    echo ERROR: ladybird not found in %%DIR%%\r\n    pause\r\n)\r\n' > "$WIN_DIR/aurora-browser.bat"

          # Write .ps1 launcher
          printf '$dir = Split-Path -Parent $MyInvocation.MyCommand.Path\n$exe = Join-Path $dir "ladybird.exe"\nif (Test-Path $exe) {\n    Start-Process -FilePath $exe -ArgumentList $args\n} else {\n    Write-Host "ladybird.exe not found. Build with WSL2 first." -ForegroundColor Red\n    Read-Host "Press Enter to exit"\n}\n' > "$WIN_DIR/aurora-browser.ps1"

          # Write README using printf to avoid heredoc indentation issues
          {
            printf 'Aurora Browser v%s for Windows\n' "$VERSION"
            printf '%s\n' "======================================"
            printf '\n'
            printf 'Built on the Ladybird LibWeb engine.\n'
            printf 'No Chromium. No Firefox. Custom open-source engine.\n'
            printf '\n'
            printf 'Installation:\n'
            printf '  1. Extract this zip file\n'
            printf '  2. Run aurora-browser.bat or aurora-browser.ps1\n'
            printf '\n'
            printf 'Building from source on Windows:\n'
            printf '  1. Install WSL2 with Ubuntu 24.04+\n'
            printf '  2. git clone https://github.com/The-Aurora-Browser/Aurora-Browser\n'
            printf '  3. cd Aurora-Browser\n'
            printf '  4. bash engine/build.sh\n'
            printf '  5. The binary will work natively on Windows\n'
            printf '\n'
            printf 'Engine: LibWeb (Ladybird) — BSD-2-Clause\n'
            printf 'Browser: Aurora Browser — MIT\n'
          } > "$WIN_DIR/README.txt"

          cd "$WIN_DIR"
          zip -r "../aurora-browser-${VERSION}-windows-x64.zip" .
          cd ../..

      - name: Generate checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.check-version.outputs.version }}
          cd build
          ZIP=$(ls aurora-browser-*-windows-x64.zip 2>/dev/null | head -n1)
          if [ -n "$ZIP" ]; then
            sha256sum "$ZIP" > checksums-SHA256-windows-${VERSION}.txt
            cat checksums-SHA256-windows-${VERSION}.txt
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            build/aurora-browser-*-windows-x64.zip
            build/checksums-SHA256-windows-*.txt
          if-no-files-found: warn

  create-release:
    needs: [check-version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: List release assets
        run: find . -maxdepth 3 -type f -not -path './.git/*' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Aurora Browser ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Aurora Browser ${{ needs.check-version.outputs.tag }}

            Built on the **[Ladybird](https://ladybird.org) LibWeb engine**.
            No Chromium. No Firefox. Custom open-source engine.

            ### Downloads

            **Linux:**
            - `aurora-browser-${{ needs.check-version.outputs.version }}-linux-x86_64.tar.gz` — Generic tarball
            - `aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb` — Debian/Ubuntu
            - `aurora-browser-${{ needs.check-version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
            - `Aurora-Browser-${{ needs.check-version.outputs.version }}-x86_64.AppImage` — Universal Linux

            **macOS:**
            - `Aurora-Browser-${{ needs.check-version.outputs.version }}-macOS.dmg` — Intel/Apple Silicon

            **Windows:**
            - `aurora-browser-${{ needs.check-version.outputs.version }}-windows-x64.zip` — Windows package with .exe launcher

            ### Build from source
            ```bash
            git clone https://github.com/The-Aurora-Browser/Aurora-Browser
            cd Aurora-Browser
            VERSION=${{ needs.check-version.outputs.version }} bash engine/build.sh
            ```

            ---
            **Engine:** LibWeb (Ladybird) — BSD-2-Clause
            **Browser:** Aurora Browser — MIT
          draft: false
          prerelease: false
          files: |
            aurora-browser-*-linux-x86_64.tar.gz
            aurora-browser_*_amd64.deb
            aurora-browser-*-1.x86_64.rpm
            Aurora-Browser-*-x86_64.AppImage
            Aurora-Browser-*-macOS.dmg
            aurora-browser-*-windows-x64.zip
            checksums-SHA256-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
